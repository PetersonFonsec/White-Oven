name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Start PostgreSQL for API integration tests
        run: docker compose -f compose.dev.yaml up -d --wait postgres
      - name: Domain, endpoint, SQLite and PostgreSQL tests
        run: pnpm test
        env:
          TEST_DATABASE_OWNER_URL: postgres://whiteoven_owner:whiteoven-dev-owner-password@127.0.0.1:5432/whiteoven
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and browser tests with synthetic capture configuration
        run: pnpm test:e2e
      - name: Admin panel browser tests against the API and PostgreSQL
        run: pnpm test:e2e:admin
        env:
          TEST_DATABASE_OWNER_URL: postgres://whiteoven_owner:whiteoven-dev-owner-password@127.0.0.1:5432/whiteoven
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Build and validate containers with synthetic data
        run: node --experimental-strip-types tests/deployment/containers.mjs
        env:
          WHITEOVEN_TEST_IMAGE: whiteoven:ci
      - name: Save the exact tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save whiteoven:ci | gzip > landing-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: landing-image-${{ github.sha }}
          path: landing-image.tar.gz
          retention-days: 1

  api-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image, migrate as owner and wait for health in the development Compose
        run: |
          docker compose -f compose.dev.yaml build api
          docker compose -f compose.dev.yaml up -d --wait --wait-timeout 90 api
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/health/ready
          curl -fsS -o /dev/null http://127.0.0.1:3000/v1/openapi.json
      - name: No pending migrations after the one-shot migrate service
        run: docker compose -f compose.dev.yaml run --rm --no-deps migrate node dist/database/migrate.js check
      - name: Invalid configuration prevents the start
        run: |
          if docker run --rm -e API_PORT=invalid whiteoven-api:dev; then
            echo "API started with invalid configuration" >&2
            exit 1
          fi
      - name: API logs
        if: always()
        run: docker compose -f compose.dev.yaml logs migrate api && docker compose -f compose.dev.yaml down -v

  publish:
    needs: [verify, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: landing-image-${{ github.sha }}
      - run: gunzip -c landing-image.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable commit tag without rebuilding
        env:
          COMMIT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ops/ghcr-publish.sh
