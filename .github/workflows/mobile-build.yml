name: Mobile build

# One store's app on EAS (ADR 0028). Manual only: a build spends EAS credits and a store build
# goes to Apple and Google. The `mobile-preview` and `mobile-store` GitHub environments hold the
# EXPO_TOKEN of WhiteOven's Expo organization; give `mobile-store` required reviewers.
on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Store slug (a manifest in apps/mobile/manifests)
        required: true
        type: string
      kind:
        description: preview (internal testers) or store (App Store and Google Play)
        required: true
        type: choice
        options: [preview, store]
      platform:
        description: Platform
        required: true
        type: choice
        options: [android, ios, all]
      submit:
        description: Send the store build to App Store Connect and the Play Console internal track
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ inputs.tenant }}-${{ inputs.kind }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mobile-${{ inputs.kind }}
    defaults:
      run:
        working-directory: apps/mobile
    env:
      TENANT: ${{ inputs.tenant }}
      KIND: ${{ inputs.kind }}
      PLATFORM: ${{ inputs.platform }}
      SUBMIT: ${{ inputs.submit }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pre-flight of the manifest, icon, build profile and submit profile
        run: |
          args=("$TENANT" "$KIND" --platform "$PLATFORM")
          if [ "$SUBMIT" = true ]; then args+=(--submit); fi
          pnpm release-check "${args[@]}"
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.2.0
          token: ${{ secrets.EXPO_TOKEN }}
      # Same pre-flight plus WHITEOVEN_API_URL read from the build's EAS environment, so a missing
      # or plain-HTTP address fails here instead of on a paid build. The value is never printed.
      - name: Pre-flight against the EAS environment
        id: preflight
        run: |
          args=("$TENANT" "$KIND" --platform "$PLATFORM" --eas)
          if [ "$SUBMIT" = true ]; then args+=(--submit); fi
          pnpm release-check "${args[@]}"
      - name: Build on EAS
        env:
          BUILD_PROFILE: ${{ steps.preflight.outputs.build_profile }}
          SUBMIT_PROFILE: ${{ steps.preflight.outputs.submit_profile }}
        run: |
          args=(--profile "$BUILD_PROFILE" --platform "$PLATFORM" --non-interactive --no-wait)
          if [ "$SUBMIT" = true ]; then args+=(--auto-submit-with-profile "$SUBMIT_PROFILE"); fi
          eas build "${args[@]}"
